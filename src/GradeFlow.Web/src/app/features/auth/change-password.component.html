<section class="form-shell narrow-form-shell">
  <div class="page-header">
    <div>
      <h1>Alterar senha</h1>
      <p>Atualize sua senha de acesso.</p>
    </div>
    <a class="button" routerLink="/assignments">Voltar</a>
  </div>

  <form class="form card narrow-card" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Senha atual
      <span class="password-input">
        <input
          formControlName="currentPassword"
          [type]="passwordVisible.currentPassword ? 'text' : 'password'"
          autocomplete="current-password" />
        <button
          class="password-toggle"
          type="button"
          [class.visible]="form.controls.currentPassword.value.length > 0"
          [attr.aria-label]="passwordVisible.currentPassword ? 'Ocultar senha atual' : 'Mostrar senha atual'"
          [title]="passwordVisible.currentPassword ? 'Ocultar senha atual' : 'Mostrar senha atual'"
          [disabled]="form.controls.currentPassword.value.length === 0"
          (click)="togglePassword('currentPassword')">
          <i [class]="passwordVisible.currentPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </button>
      </span>
    </label>

    <label>
      Nova senha
      <span class="password-input">
        <input
          formControlName="newPassword"
          [type]="passwordVisible.newPassword ? 'text' : 'password'"
          autocomplete="new-password" />
        <button
          class="password-toggle"
          type="button"
          [class.visible]="form.controls.newPassword.value.length > 0"
          [attr.aria-label]="passwordVisible.newPassword ? 'Ocultar nova senha' : 'Mostrar nova senha'"
          [title]="passwordVisible.newPassword ? 'Ocultar nova senha' : 'Mostrar nova senha'"
          [disabled]="form.controls.newPassword.value.length === 0"
          (click)="togglePassword('newPassword')">
          <i [class]="passwordVisible.newPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </button>
      </span>
    </label>

    <div
      class="password-meter"
      [class.weak]="passwordStrength().level === 'weak'"
      [class.medium]="passwordStrength().level === 'medium'"
      [class.strong]="passwordStrength().level === 'strong'">
      <span></span>
      <small>{{ passwordStrength().label }}</small>
    </div>
    <ul class="password-rules">
      @for (rule of passwordRules(); track rule.label) {
        <li [class.ok]="rule.ok">{{ rule.label }}</li>
      }
    </ul>

    <label>
      Confirmar nova senha
      <span class="password-input">
        <input
          formControlName="confirmPassword"
          [type]="passwordVisible.confirmPassword ? 'text' : 'password'"
          autocomplete="new-password" />
        <button
          class="password-toggle"
          type="button"
          [class.visible]="form.controls.confirmPassword.value.length > 0"
          [attr.aria-label]="passwordVisible.confirmPassword ? 'Ocultar confirmação da senha' : 'Mostrar confirmação da senha'"
          [title]="passwordVisible.confirmPassword ? 'Ocultar confirmação da senha' : 'Mostrar confirmação da senha'"
          [disabled]="form.controls.confirmPassword.value.length === 0"
          (click)="togglePassword('confirmPassword')">
          <i [class]="passwordVisible.confirmPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </button>
      </span>
    </label>

    @if (error) {
      <div class="error">{{ error }}</div>
    }

    @if (success) {
      <div class="success">{{ success }}</div>
    }

    <div class="actions form-actions">
      <button class="button primary" type="submit" [disabled]="form.invalid">Salvar senha</button>
    </div>
  </form>
</section>
