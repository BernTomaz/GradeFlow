<section class="auth-shell">
  <div class="auth-heading">
    <img class="auth-logo" src="favicon.svg" width="54" height="54" alt="" />
    <strong>GradeFlow</strong>
  </div>
  <p class="auth-subtitle">Use seu email e senha para acessar o GradeFlow.</p>

  <form class="form card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input formControlName="email" type="email" autocomplete="email" />
    </label>

    <label>
      Senha
      <span class="password-input">
        <input
          formControlName="password"
          [type]="passwordVisible ? 'text' : 'password'"
          autocomplete="current-password" />
        <button
          type="button"
          [attr.aria-label]="passwordVisible ? 'Ocultar senha' : 'Mostrar senha'"
          [title]="passwordVisible ? 'Ocultar senha' : 'Mostrar senha'"
          (click)="togglePassword()">
          <i [class]="passwordVisible ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </button>
      </span>
    </label>

    @if (error) {
      <div class="error">{{ error }}</div>
    }

    <div class="actions form-actions">
      <button class="button primary" type="submit" [disabled]="form.invalid || loading">
        @if (loading) {
          Aguarde...
        } @else {
          Entrar
        }
      </button>
    </div>
  </form>
</section>
